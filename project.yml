name: EasyshipDash
options:
  bundleIdPrefix: com.sergeyvolf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  EasyshipDash:
    type: application
    platform: iOS
    sources:
      - path: EasyshipDash
    info:
      path: EasyshipDash/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyvolf.EasyshipDash
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
