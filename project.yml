name: ShipPeek
options:
  bundleIdPrefix: com.sergeyvolf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ShipPeek:
    type: application
    platform: iOS
    sources:
      - path: ShipPeek
    info:
      path: ShipPeek/Info.plist
      properties:
        CFBundleDisplayName: ShipPeek
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Answers App Store Connect's export-compliance question up front. The app only uses HTTPS
        # via URLSession, which is exempt; without this key Connect asks on every single upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sergeyvolf.ShipPeek
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
